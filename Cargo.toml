[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/common",
    "crates/manager",
    "crates/worker",
    "crates/tunasync",
    "crates/tunasynctl",
    "crates/migrate",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/zyh001/tunasync-rs"
description = "Mirror job management tool — Rust port of tuna/tunasync, wire-compatible with the Go implementation"

[workspace.dependencies]
# In-tree crates
tunasync-protocol = { path = "crates/protocol" }
tunasync-common   = { path = "crates/common" }
tunasync-manager  = { path = "crates/manager" }
tunasync-worker   = { path = "crates/worker" }

# Async runtime
tokio       = { version = "1.40", features = ["full"] }
tokio-util  = { version = "0.7",  features = ["rt"] }
futures     = "0.3"
async-trait = "0.1"

# Web / HTTP
axum        = { version = "0.7", features = ["json"] }
# Use tls-rustls-no-provider so axum-server does NOT force aws-lc-rs.
# We register ring as the crypto provider at startup (see crates/tunasync/src/main.rs).
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tower       = { version = "0.4" }
tower-http  = { version = "0.5", features = ["trace"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Declare rustls directly so we can pin the crypto backend to ring only.
# ring cross-compiles cleanly to all targets (loongarch64, riscv64, etc.)
# via pure-C fallback; aws-lc-rs (the other backend) does not support
# loongarch64 and requires cmake + BoringSSL C++ to build.
rustls      = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Serde / config
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# Time
chrono      = { version = "0.4", features = ["serde"] }
chrono-tz   = "0.10"
humantime         = "2"
humantime-serde   = "1"
cron        = "0.12"

# Logging / errors
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
thiserror           = "1"
anyhow              = "1"

# Storage
redb     = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
redis    = "0.27"

# CLI
clap          = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Misc
shell-words = "1"
hostname    = "0.4"
regex       = "1"
os_pipe     = "1"
url         = { version = "2", features = ["serde"] }
once_cell   = "1"
bytes       = "1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
