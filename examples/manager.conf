# tunasync manager configuration — all fields shown with defaults or examples.

[server]
addr = "0.0.0.0"
port = 14242
# ssl_cert = "/etc/tunasync/server.pem"
# ssl_key  = "/etc/tunasync/server.key"

[files]
db_type  = "redb"  # must be explicit for migration checks; Go defaults to bolt
db_file  = "/var/lib/tunasync/tunasync.db"
ca_cert  = ""   # path to CA cert for verifying worker TLS (leave empty for plain HTTP)

# ── Notifications (new in Rust port) ─────────────────────────────────────────
# [notify]
# Webhook URL — receives a JSON POST {"text": "…"} on events.
# webhook_url = "https://hooks.slack.com/services/…"
#
# Mark a mirror as stale if it has not synced successfully in this window.
# Accepts Go-style duration strings: "24h", "48h", etc.
# stale_after = "48h"
#
# Fire a webhook alert after this many consecutive failures.
# alert_after_failures = 3
