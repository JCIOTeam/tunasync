# tunasync worker configuration — all fields shown with defaults or examples.
# Fields with a comment "(default: …)" are optional; remove them to use the
# default.  Fields marked "(new)" were added in this Rust port.

[global]
name = "my-worker"
log_dir = "/var/log/tunasync"
mirror_dir = "/srv/mirrors"

# Maximum concurrent syncing jobs (default: 4). Use a positive value;
# `tunasync worker --check` rejects zero for migration safety.
concurrent = 4

# Default sync interval in minutes (default: 1440 = 24 h).
# Fixed-delay mirrors must have a positive effective interval.
interval = 1440

# Interval mode (default: "fixed-delay"). Fixed-delay schedules next run from
# local completion + interval; no persisted completion starts immediately and a
# blackout retry is in 5 minutes. Fixed-rate uses local wall-clock slots.
# interval_mode = "fixed-delay"
# interval_mode = "fixed-rate"
# fixed_rate_anchor = "00:15"  # strict HH:MM; required for fixed-rate
# Fixed-rate interval must be 1..=1440 and divide 1440; its slots use timezone.

# Bound reporting memory (default / explicit 0: 1024; effective range 1..=4096).
# Ordinary status/size telemetry is FIFO, then overflow coalesces latest values.
# Schedule reporting always retains one complete latest-wins snapshot from its
# first enqueue, with an independent row bound. Restart to change.
# report_max_resources = 1024

# Default retry count on failure (default: 3).
retry = 3

# Default per-sync wall-clock timeout in seconds; 0 = no timeout (default: 0).
timeout = 0

# ── Time-of-day scheduling (cron + blackout) ────────────────────────────────
#
# IMPORTANT: cron expressions and blackout windows are interpreted in the
# IANA timezone named below. If `timezone` is empty or missing, **UTC** is
# used. The Go `tunasync` worker has always used the host's local timezone
# implicitly, so operators upgrading from Go who rely on local-time schedules
# MUST set `timezone` explicitly. (new)
#
# Examples:
#   timezone = "Asia/Shanghai"     # CST, UTC+8
#   timezone = "America/New_York"  # EST/EDT
#   timezone = "Europe/Berlin"     # CET/CEST
#   timezone = "UTC"               # explicit UTC
#
# Invalid names cause the worker to fail at startup with a clear message.
# This is a worker-wide default; individual mirrors can override it via
# `[[mirrors]].timezone` below.
# timezone = "UTC"

# Per-upstream-host concurrency limits (new).
# Prevents hammering a single upstream server from multiple mirrors at once.
# Hot-reload supported: edits take effect on the next SIGHUP/reload.
# [global.per_upstream_concurrent]
# "rsync.kernel.org" = 2
# "ftp.debian.org"   = 1

# Worker-wide base directory for atomic-publish staging (new).
# When set, each mirror with `atomic_publish = true` stages syncs into
# `<staging_dir>/<mirror_name>` before the atomic swap into mirror_dir.
# When empty (default), staging falls back to `<log_dir>/staging/<name>`,
# which only works when log_dir and mirror_dir are on the same filesystem.
#
# Most production deployments put logs on the OS disk and mirror data on a
# separate data disk — set staging_dir to a path on the data disk so it
# shares a filesystem with mirror_dir (rename(2) requires this).
#
# Recommended: a hidden directory under mirror_dir (leading dot blocks
# nginx's default auto-index from serving in-progress staging contents),
# or a sibling path outside the document root entirely.
# staging_dir = "/srv/mirrors/.staging"

[manager]
api_base = "http://127.0.0.1:14242"
# ca_cert = "/etc/tunasync/ca.pem"   # enable HTTPS
# api_token = "same-shared-token-as-manager"  # omit/empty disables auth
# Legacy `token` is mapped for compatibility, but --check warns until it is
# renamed to `api_token`; when both are set, `api_token` wins.

# Optional Linux namespace-execution broker. See docs/network-namespaces.md.
[netns_broker]
# socket = "/run/tunasync/netns-broker.sock"
# generation = "2026-08-16-1" # increase when namespace mapping/launch content changes

[server]
# Same-host safe default. For a remote manager, set both hostname and
# listen_addr to this worker's private, manager-reachable address.
hostname = "127.0.0.1"
listen_addr = "127.0.0.1"
listen_port = 6000

# ── Example: rsync mirror ────────────────────────────────────────────────────

[[mirrors]]
name       = "debian"
provider   = "rsync"
upstream   = "rsync://ftp.debian.org/debian/"
use_ipv4   = false
use_ipv6   = false
# rsync_options = ["--bwlimit=100000"]
# Mirror env is inherited key-by-key by nested mirrors and is passed to rsync,
# two-stage rsync, Docker wrapping, and rsync probes. Explicit username/password
# fields override env.USER and env.RSYNC_PASSWORD.
# [mirrors.env]
# RSYNC_PROXY = "proxy.example:873"

# Docker/cgroup memory limit accepts Go-style binary units such as "256MiB",
# as well as compact forms such as "256M". Nested zero inherits the parent.
# memory_limit = "256MiB"

# Disk quota: skip sync if less than this much free space is available (new).
# Empty or missing = no quota check.
# disk_quota = "100G"

# Cron schedule (new). Overrides the interval setting when non-empty.
# Accepts both classic 5-field POSIX cron (minute hour dom month dow) and
# the cron-crate native 6/7-field format (sec minute hour dom month dow [year]).
#
# Interpreted in the mirror's effective timezone (per-mirror `timezone`
# below, falling back to `[global].timezone`, falling back to UTC). For
# example, with `timezone = "Asia/Shanghai"` and `cron = "0 3 * * *"`,
# syncs fire at 03:00 China time (= 19:00 UTC the previous day).
# cron = "0 3 * * *"   # run daily at 03:00 local time (per timezone below)

# Per-mirror scheduling override example. This explicitly clears an inherited
# fixed-rate anchor, so this mirror uses completion-based scheduling instead.
# interval_mode = "fixed-delay"
# interval = 120

# Per-mirror timezone override (new). Empty means use [global].timezone.
# Applies to `cron` and `blackout` for this mirror only.
# timezone = "Asia/Shanghai"

# Blackout windows: suppress new syncs during busy hours (new).
# In-progress syncs are never interrupted.
# Interpreted in the same timezone as `cron` (see above).
# Format: "HH:MM-HH:MM [Mon-Fri | Sat-Sun | daily | <single weekday>]"
# Wraparound is supported: "22:00-04:00" covers 22:00–23:59 and 00:00–04:00.
# blackout = ["08:00-18:00 Mon-Fri", "22:00-04:00"]

# Job priority 0–100; higher = runs first when the semaphore is contested (new).
# priority = 50

# Upstream failover probe (new): check reachability before syncing.
# Primary + all fallbacks are probed CONCURRENTLY with a 15s hard timeout
# per URL. As soon as any URL responds, the sync starts against the
# `upstream` URL (the fallback list is for health-checking only — it does
# NOT change the actual sync data source).
# check_upstream = false
# upstream_fallback = ["rsync://mirror.example.com/debian/"]

# Linux only: run sync commands and probes in this pre-existing /run/netns name.
# tunasync does not create or manage the namespace. Requires the root broker
# policy; namespaced URLs cannot contain userinfo, query, or fragment. Docker
# and network_namespace are mutually exclusive; cgroup.enable cannot coexist
# with any network_namespace. See docs/network-namespaces.md.
# network_namespace = "egress-a"

# Atomic publish: rsync into a staging directory first, then atomically swap
# it with the publish dir via renameat2(RENAME_EXCHANGE) on success. Users
# always see either the complete old content or the complete new content;
# there is no window where the publish path is missing or half-synced.
# Falls back to a two-step rename (brief 404 window) if the kernel /
# filesystem doesn't support RENAME_EXCHANGE. (new)
#
# REQUIREMENT: the staging directory and publish directory (effective
# mirror_dir for this mirror) must be on the SAME filesystem — rename(2)
# is only atomic within a single mount point. The worker checks device IDs
# at sync time and refuses to start if they differ.
#
# By default staging is placed under `<log_dir>/staging/<name>`, which only
# works when log_dir and mirror_dir share a filesystem. Most production
# deployments put logs on the OS disk and mirror data on a separate large
# data disk, so the default fails the same-filesystem check. In that case
# set `staging_dir` (per-mirror) or `[global].staging_dir` (worker-wide)
# to a path on the same filesystem as the mirror data.
#
# Example layout where logs and mirror data are on separate disks:
#
#   [global]
#   log_dir     = "/var/log/tunasync"
#   mirror_dir  = "/srv/mirrors"
#   staging_dir = "/srv/mirrors/.staging"   # same fs as mirror_dir
#
# The leading dot in `.staging` blocks nginx's default auto-index from
# serving the in-progress directory; for stricter setups, use a sibling
# path outside the document root entirely (e.g. /srv/staging).
#
# Per-mirror override (takes precedence over [global].staging_dir):
# staging_dir = "/data2/staging"
#
# atomic_publish = false

# ── Example: two-stage-rsync mirror ─────────────────────────────────────────

# [[mirrors]]
# name     = "archlinux"
# provider = "two-stage-rsync"
# upstream = "rsync://mirror.rackspace.com/archlinux/"

# ── Example: command-based mirror ───────────────────────────────────────────

# [[mirrors]]
# name     = "custom"
# provider = "command"
# upstream = "https://example.com"
# command  = "/usr/local/bin/my-sync-script"
