name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── native x86_64 ────────────────────────────────────────────────────
          - target:   x86_64-unknown-linux-gnu
            os:       ubuntu-22.04
            artifact: tunasync-linux-amd64

          # x86_64-musl: musl-gcc is a native wrapper (no cross-compilation).
          # Produces a fully static binary with no glibc dependency.
          - target:   x86_64-unknown-linux-musl
            os:       ubuntu-22.04
            artifact: tunasync-linux-amd64-musl
            apt:      musl-tools
            cc:       musl-gcc

          # ── aarch64 glibc ───────────────────────────────────────────────────
          - target:   aarch64-unknown-linux-gnu
            os:       ubuntu-22.04
            artifact: tunasync-linux-aarch64
            apt:      gcc-aarch64-linux-gnu
            linker:   aarch64-linux-gnu-gcc
            cc:       aarch64-linux-gnu-gcc
            cxx:      aarch64-linux-gnu-g++

          # ── aarch64 musl (static) ────────────────────────────────────────────
          # Cannot use gcc-aarch64-linux-gnu (glibc cross-compiler) as the C
          # compiler here: it emits __memcpy_chk / open64 / __memset_chk via
          # FORTIFY_SOURCE, which are glibc symbols absent in musl.
          #
          # cargo-zigbuild uses zig as the C cross-compiler, which provides its
          # own musl headers and libc — no system cross-toolchain needed.
          - target:   aarch64-unknown-linux-musl
            os:       ubuntu-22.04
            artifact: tunasync-linux-aarch64-musl
            zigbuild: true

          # ── armv7 ────────────────────────────────────────────────────────────
          - target:   armv7-unknown-linux-gnueabihf
            os:       ubuntu-22.04
            artifact: tunasync-linux-armv7
            apt:      gcc-arm-linux-gnueabihf
            linker:   arm-linux-gnueabihf-gcc
            cc:       arm-linux-gnueabihf-gcc
            cxx:      arm-linux-gnueabihf-g++

          # ── riscv64 ──────────────────────────────────────────────────────────
          - target:   riscv64gc-unknown-linux-gnu
            os:       ubuntu-22.04
            artifact: tunasync-linux-riscv64
            apt:      gcc-riscv64-linux-gnu
            linker:   riscv64-linux-gnu-gcc
            cc:       riscv64-linux-gnu-gcc
            cxx:      riscv64-linux-gnu-g++

          # ── loongarch64 ──────────────────────────────────────────────────────
          # Requires ubuntu-24.04 (first Ubuntu with LoongArch cross-compiler in
          # the main apt repo).  TLS backend is ring (no aws-lc-rs/BoringSSL).
          - target:   loongarch64-unknown-linux-gnu
            os:       ubuntu-24.04
            artifact: tunasync-linux-loongarch64
            apt:      gcc-14-loongarch64-linux-gnu g++-14-loongarch64-linux-gnu
            linker:   loongarch64-linux-gnu-gcc-14
            cc:       loongarch64-linux-gnu-gcc-14
            cxx:      loongarch64-linux-gnu-g++-14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install apt cross-compilation tools
        if: matrix.apt != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure cross linker
        if: matrix.linker != ''
        run: |
          mkdir -p .cargo
          printf '[target.%s]\nlinker = "%s"\n' \
            "${{ matrix.target }}" "${{ matrix.linker }}" >> .cargo/config.toml

      # Export CC_<triple> and CXX_<triple> so ring and sqlite3-sys build
      # scripts (via cc-rs) find the right cross-compiler.
      # Skipped for zigbuild targets — zig provides its own toolchain.
      - name: Export C cross-compiler
        if: matrix.cc != ''
        run: |
          TARGET="${{ matrix.target }}"
          echo "CC_${TARGET//-/_}=${{ matrix.cc }}" >> "$GITHUB_ENV"
          if [ -n "${{ matrix.cxx }}" ]; then
            echo "CXX_${TARGET//-/_}=${{ matrix.cxx }}" >> "$GITHUB_ENV"
          fi

      # cargo-zigbuild: used for musl cross-compilation targets where the
      # system glibc cross-compiler cannot produce musl-compatible object files.
      # zig provides its own bundled musl headers and libc.
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build
        run: |
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package
        run: |
          DIR="target/${{ matrix.target }}/release"
          tar -czf "${{ matrix.artifact }}.tar.gz" \
            -C "$DIR" tunasync tunasynctl
          sha256sum "${{ matrix.artifact }}.tar.gz" \
            > "${{ matrix.artifact }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev
        run: |
          prev=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          echo "tag=${prev}" >> $GITHUB_OUTPUT

      - name: Build changelog
        id: log
        run: |
          if [ -n "${{ steps.prev.outputs.tag }}" ]; then
            range="${{ steps.prev.outputs.tag }}..${{ github.ref_name }}"
          else
            range="HEAD~20..HEAD"
          fi
          {
            echo "body<<EOF"
            echo "## What's changed"
            echo ""
            git log "$range" --pretty="format:- %s" --no-merges
            echo ""
            echo ""
            echo "**Full diff**: [${{ steps.prev.outputs.tag }}...${{ github.ref_name }}](../../compare/${{ steps.prev.outputs.tag }}...${{ github.ref_name }})"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.log.outputs.body }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
