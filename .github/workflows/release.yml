name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── native x86_64 ────────────────────────────────────────
          - target:   x86_64-unknown-linux-gnu
            os:       ubuntu-22.04
            artifact: tunasync-linux-amd64

          - target:   x86_64-unknown-linux-musl
            os:       ubuntu-22.04
            artifact: tunasync-linux-amd64-musl
            apt:      musl-tools

          # ── aarch64 ──────────────────────────────────────────────
          - target:   aarch64-unknown-linux-gnu
            os:       ubuntu-22.04
            artifact: tunasync-linux-aarch64
            apt:      gcc-aarch64-linux-gnu
            linker:   aarch64-linux-gnu-gcc
            cc:       aarch64-linux-gnu-gcc
            cxx:      aarch64-linux-gnu-g++

          - target:   aarch64-unknown-linux-musl
            os:       ubuntu-22.04
            artifact: tunasync-linux-aarch64-musl
            apt:      gcc-aarch64-linux-gnu musl-tools
            linker:   aarch64-linux-gnu-gcc
            cc:       aarch64-linux-gnu-gcc
            cxx:      aarch64-linux-gnu-g++
            musl_target: aarch64

          # ── armv7 ────────────────────────────────────────────────
          - target:   armv7-unknown-linux-gnueabihf
            os:       ubuntu-22.04
            artifact: tunasync-linux-armv7
            apt:      gcc-arm-linux-gnueabihf
            linker:   arm-linux-gnueabihf-gcc
            cc:       arm-linux-gnueabihf-gcc
            cxx:      arm-linux-gnueabihf-g++

          # ── riscv64 ──────────────────────────────────────────────
          - target:   riscv64gc-unknown-linux-gnu
            os:       ubuntu-22.04
            artifact: tunasync-linux-riscv64
            apt:      gcc-riscv64-linux-gnu
            linker:   riscv64-linux-gnu-gcc
            cc:       riscv64-linux-gnu-gcc
            cxx:      riscv64-linux-gnu-g++

          # ── loongarch64 ──────────────────────────────────────────
          # Requires ubuntu-24.04 (first Ubuntu release with LoongArch
          # cross-compiler in the main apt repo).
          # aws-lc-rs is NOT used (switched to ring backend) so no
          # BoringSSL cmake cross-compilation is needed.
          - target:   loongarch64-unknown-linux-gnu
            os:       ubuntu-24.04
            artifact: tunasync-linux-loongarch64
            apt:      gcc-14-loongarch64-linux-gnu g++-14-loongarch64-linux-gnu
            linker:   loongarch64-linux-gnu-gcc-14
            cc:       loongarch64-linux-gnu-gcc-14
            cxx:      loongarch64-linux-gnu-g++-14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.apt != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure cross linker
        if: matrix.linker != ''
        run: |
          mkdir -p .cargo
          printf '[target.${{ matrix.target }}]\nlinker = "%s"\n' \
            "${{ matrix.linker }}" >> .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # C/C++ compilers for ring's (and any other C dep's) cross build.
          # Variable names use the target triple with hyphens → underscores.
          CC_x86_64_unknown_linux_gnu:            gcc
          CC_x86_64_unknown_linux_musl:           musl-gcc
          CC_aarch64_unknown_linux_gnu:           ${{ matrix.cc }}
          CC_aarch64_unknown_linux_musl:          ${{ matrix.cc }}
          CC_armv7_unknown_linux_gnueabihf:       ${{ matrix.cc }}
          CC_riscv64gc_unknown_linux_gnu:         ${{ matrix.cc }}
          CC_loongarch64_unknown_linux_gnu:       ${{ matrix.cc }}
          CXX_aarch64_unknown_linux_gnu:          ${{ matrix.cxx }}
          CXX_aarch64_unknown_linux_musl:         ${{ matrix.cxx }}
          CXX_armv7_unknown_linux_gnueabihf:      ${{ matrix.cxx }}
          CXX_riscv64gc_unknown_linux_gnu:        ${{ matrix.cxx }}
          CXX_loongarch64_unknown_linux_gnu:      ${{ matrix.cxx }}

      - name: Package
        run: |
          DIR="target/${{ matrix.target }}/release"
          tar -czf "${{ matrix.artifact }}.tar.gz" \
            -C "$DIR" tunasync tunasynctl
          sha256sum "${{ matrix.artifact }}.tar.gz" \
            > "${{ matrix.artifact }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev
        run: |
          prev=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          echo "tag=${prev}" >> $GITHUB_OUTPUT

      - name: Build changelog
        id: log
        run: |
          if [ -n "${{ steps.prev.outputs.tag }}" ]; then
            range="${{ steps.prev.outputs.tag }}..${{ github.ref_name }}"
          else
            range="HEAD~20..HEAD"
          fi
          {
            echo "body<<EOF"
            echo "## What's changed"
            echo ""
            git log "$range" --pretty="format:- %s" --no-merges
            echo ""
            echo ""
            echo "**Full diff**: [${{ steps.prev.outputs.tag }}...${{ github.ref_name }}](../../compare/${{ steps.prev.outputs.tag }}...${{ github.ref_name }})"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.log.outputs.body }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
