name: CI

on:
  push:
    branches: [rs]
  pull_request:
    branches: [rs]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  release:
    name: Build release binaries
    runs-on: ubuntu-latest
    needs: [check, test, fmt]
    if: github.ref == 'refs/heads/rs' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Upload tunasync binary
        uses: actions/upload-artifact@v4
        with:
          name: tunasync-linux-amd64
          path: target/release/tunasync
      - name: Upload tunasynctl binary
        uses: actions/upload-artifact@v4
        with:
          name: tunasynctl-linux-amd64
          path: target/release/tunasynctl