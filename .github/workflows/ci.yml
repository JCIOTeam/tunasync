name: CI

on:
  push:
    branches: [rs]
  pull_request:
    branches: [rs]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  privileged-netns-smoke:
    name: Privileged network namespace smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install network namespace tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y iproute2
      - name: Build isolated smoke targets
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tunasync-netns-target
        run: |
          cargo build -p tunasync-netns-broker --bins
          cargo test -p tunasync-netns-broker --no-run
      - name: Install root-controlled smoke executables
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tunasync-netns-target
        run: |
          sudo install -d -o root -g root -m 0755 /usr/local/libexec
          TEST_BIN=$(printf '%s\n' "$CARGO_TARGET_DIR"/debug/deps/privileged_smoke-* | \
            while read -r candidate; do
              if [ -x "$candidate" ] && [ "${candidate##*.}" != "d" ]; then
                printf '%s\n' "$candidate"
                break
              fi
            done)
          test -n "$TEST_BIN"
          sudo install -o root -g root -m 0755 \
            "$CARGO_TARGET_DIR/debug/tunasync-netns-broker" \
            /usr/local/libexec/tunasync-netns-broker-smoke
          sudo install -o root -g root -m 0755 \
            "$CARGO_TARGET_DIR/debug/tunasync-netns-smoke-helper" \
            /usr/local/libexec/tunasync-netns-smoke-helper
          sudo install -o root -g root -m 0755 "$TEST_BIN" \
            /usr/local/libexec/tunasync-netns-privileged-smoke-test
      - name: Run privileged broker smoke test
        run: |
          sudo env \
            TUNASYNC_NETNS_BROKER=/usr/local/libexec/tunasync-netns-broker-smoke \
            TUNASYNC_NETNS_SMOKE_HELPER=/usr/local/libexec/tunasync-netns-smoke-helper \
            /usr/local/libexec/tunasync-netns-privileged-smoke-test \
            privileged_setns_execution_smoke_test \
            --ignored --nocapture --exact

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Lightweight cross-compile check for every release target.
  # Uses `cargo check` (no link step) to catch type/API errors early without
  # needing a full cross sysroot.  Build scripts (ring, sqlite3-sys) still run
  # and need a C cross-compiler — the `cc` field is exported to CC_<triple>.
  cross-check:
    name: Cross-check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            cc: aarch64-linux-gnu-gcc

          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-22.04
            apt: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            cc: arm-linux-gnueabihf-gcc

          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-22.04
            apt: gcc-riscv64-linux-gnu
            linker: riscv64-linux-gnu-gcc
            cc: riscv64-linux-gnu-gcc

          # ubuntu-24.04: first Ubuntu release with LoongArch in main apt repo.
          - target: loongarch64-unknown-linux-gnu
            os: ubuntu-24.04
            apt: gcc-14-loongarch64-linux-gnu
            linker: loongarch64-linux-gnu-gcc-14
            cc: loongarch64-linux-gnu-gcc-14

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}

      - name: Install cross-compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure linker and C compiler
        run: |
          # Linker for rustc link step (cargo config).
          mkdir -p .cargo
          printf '[target.%s]\nlinker = "%s"\n' \
            "${{ matrix.target }}" "${{ matrix.linker }}" >> .cargo/config.toml

          # CC_<triple> — used by ring and other C build scripts via cc-rs.
          # Must be exported before cargo check so build scripts can find it.
          TARGET="${{ matrix.target }}"
          echo "CC_${TARGET//-/_}=${{ matrix.cc }}" >> "$GITHUB_ENV"

      - run: cargo check --workspace --target ${{ matrix.target }}
